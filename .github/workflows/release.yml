# v로 시작하는 태그를 올리면 세 OS에서 테스트하고 빌드해서 GitHub Releases 초안(draft)에 올린다.
# 초안을 "Publish" 해야 자동 업데이트가 새 버전을 본다.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # 세 작업이 같은 초안을 동시에 만들면 초안이 여러 개 생길 수 있어서 하나씩 돌린다.
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      # 플랫폼을 지정하지 않으면 지금 OS용으로 만든다 (package.json의 win / mac / linux 설정).
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
